name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.0
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    - name: Run tests
      run: uv run --with pytest pytest tests/ -v
