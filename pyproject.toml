[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "arglite"
version = "0.10.0"
dependencies = [
    "rich",
    "vurze",
    "twine"
]
authors = [
    {name = "Douglas Luman", email = "dluman@allegheny.edu"}
]
readme = "README.md"
description = "A lightweight, dynamic arg parser for fun, but not profit."